[package]
name = "npkl"
version = "1.0.8"
edition = "2024"
description = "Like npkill, but written in Rust."
authors = ["Val Saven <val.saven@gmail.com>"]
license = "MIT"
repository = "https://github.com/valsaven/npkl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byte-unit = "5.2.0"
dialoguer = "0.12.0"
indicatif = "0.17"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
